<!DOCTYPE html>
<html>
<head>

</head>
<body>

  <div class="navbar">

    <div class="logo-icon"></div>
    <span>Hostel Fix<span class="logo-accent">Fix</span></span>
  </div>
  <div>
    <a href="index.html">Home</a>
    <a href="complaint.html">New Complaint</a>

    <a href="student-login.html">Student Login</a>
  </div>

<h2>Submit Hostel Complaint</h2>

<form id="complaintForm">
  <label>Student Name:</label>
  <input type="text" id="name" required>

  <label>Room Number:</label>
  <input type="text" id="room" required>

  <label>Category:</label>
  <select id="category">
    <option>Water Issue</option>
    <option>Electricity Issue</option>
    <option>Cleaning Issue</option>
    <option>Furniture Issue</option>
    <option>Other</option>
  </select>

  <label>Description:</label>
  <textarea id="description" required></textarea>

  <button type="submit">Submit Complaint</button>
</form>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="script.js"></script>
</body>
</html>
